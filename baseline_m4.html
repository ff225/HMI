<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>M4 vertical rail terminal</title>
<style id="base">
:root{
  --font-scale:1.0;--line-height:1.45;--letter-spacing:0px;
  --touch-target-min:52px;--gap:14px;--pad:14px;
  --fg:#16181d;--fg-muted:#4a4f59;--bg:#f2f3f5;--surface:#ffffff;--border:#c8ccd4;
  --rail-width:120px;
}
*{box-sizing:border-box;margin:0}
body{
  width:800px;height:1280px;overflow:hidden;
  font-family:system-ui,sans-serif;font-size:calc(17px * var(--font-scale));
  line-height:var(--line-height);letter-spacing:var(--letter-spacing);
  color:var(--fg);background:var(--bg);
  padding:var(--pad) var(--pad) var(--pad) calc(var(--rail-width) + var(--pad));
  display:flex;flex-direction:column;gap:var(--gap);
}
[data-hidden="true"]{display:none}
#rail{position:fixed;left:0;top:0;bottom:0;width:120px;background:#e4e6ea;
  border-right:1px solid var(--border)}
#header{background:var(--surface);border:1px solid var(--border);padding:var(--pad)}
#machine-name{font-weight:600;display:block}
#status{color:var(--fg-muted);font-size:0.9em}
#alarm-banner{min-width:300px;min-height:48px;display:flex;align-items:center;
  padding:0 var(--pad);background:#8a4b00;color:#ffffff;font-weight:600}
#metrics{display:flex;flex-direction:column;gap:var(--gap)}
.metric{background:var(--surface);border:1px solid var(--border);padding:var(--pad);
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--gap)}
.metric-label{color:var(--fg-muted);font-size:0.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metric-value{font-size:1.5em;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#controls{display:flex;flex-wrap:wrap;gap:var(--gap)}
.control{flex:1 1 40%;min-width:var(--touch-target-min);min-height:var(--touch-target-min);
  border:1px solid var(--border);background:var(--surface);color:var(--fg);font:inherit;
  padding:var(--pad);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#panels{display:flex;flex-direction:column;gap:var(--gap);flex:1 1 auto;min-height:0}
.panel{background:var(--surface);border:1px solid var(--border);padding:var(--pad);overflow:hidden}
.panel-title{font-weight:600;margin-bottom:6px}
.panel-body{color:var(--fg-muted);font-size:0.9em}
#emergency-stop{position:fixed;left:16px;top:16px;width:88px;height:88px;
  border:2px solid #4a0000;border-radius:50%;background:#a11212;color:#ffffff;
  font:inherit;font-weight:700;font-size:0.8em;display:flex;align-items:center;
  justify-content:center;text-align:center;cursor:pointer}
</style>
<style id="adaptation"></style>
</head>
<body>
  <div id="rail"></div>
  <div id="header">
    <span id="machine-name">Curing station 3</span>
    <span id="status">Cycle 44 of 120 &middot; holding</span>
  </div>
  <div id="alarm-banner">No active alarms</div>
  <div id="metrics">
    <div class="metric"><span class="metric-label">Chamber temperature</span><span class="metric-value">148 &deg;C</span></div>
    <div class="metric"><span class="metric-label">Chamber pressure</span><span class="metric-value">3.1 bar</span></div>
    <div class="metric"><span class="metric-label">Cycle count</span><span class="metric-value">44</span></div>
  </div>
  <div id="controls">
    <button class="control" id="ctl-start">Start</button>
    <button class="control" id="ctl-stop">Stop</button>
    <button class="control" id="ctl-hold">Hold</button>
    <button class="control" id="ctl-reset">Reset</button>
  </div>
  <div id="panels">
    <section class="panel" id="panel-warnings" data-panel="warnings">
      <div class="panel-title">Warnings</div>
      <div class="panel-body">Door interlock engaged &mdash; do not force the handle.</div>
    </section>
    <section class="panel" id="panel-checklist" data-panel="checklist">
      <div class="panel-title">Checklist</div>
      <div class="panel-body">Confirm fixture seating before starting the next cycle.</div>
    </section>
  </div>
  <button id="emergency-stop">STOP</button>
</body>
</html>
